name: Bug report
description: netip-ts behaves wrongly or differently from Go's net/netip
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code and the input string(s).
      render: ts
      placeholder: Addr.parse("...")
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What Go's net/netip returns for the same input, if you know (https://go.dev/play).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: netip-ts version and runtime
      placeholder: 2.0.0, Node 24
